name = "trmnl-og-xs"
main = "worker.js"
compatibility_date = "2026-10-01"

# No cron and no KV: the picture is rendered when the device asks for it.

[vars]
LATITUDE = "33.4343"
LONGITUDE = "-112.0116"
RADIUS_NM = "30"
AIRPORT_LABEL = "KPHX"
OWNSHIP_ALT_FT = "1135"      # field elevation, draws the ground line
LOW_SLOTS = "5"              # aircraft below LOW_FT, nearest first
LOW_FT = "12000"
ALT_SLOTS = "7"              # highest remaining aircraft
TAG_HOLD_SECONDS = "10"      # tag boxes and their text are re-laid-out this often; icons move every frame
REFRESH_SECONDS = "1"       # sent to the device as refresh_rate
TIME_ZONE = "America/Phoenix"
ROUTES = "true"              # origin-destination on airliner tags
XS_MODE = "ew"               # ew = west/east of the airport, radial = airport on the left
